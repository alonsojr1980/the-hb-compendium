name: Deploy site to GitHub Pages

# Publishes the /development folder as the GitHub Pages site.
# GitHub Pages' "Deploy from a branch" mode only supports / or /docs, so we use
# GitHub Actions to upload /development as the Pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate library data
        run: node development/tests/validate-library.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (development/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: development

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
